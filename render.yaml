services:
  - type: web
    name: noteai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./noteai.db
      - key: ANTHROPIC_API_KEY
        value: sk-test
