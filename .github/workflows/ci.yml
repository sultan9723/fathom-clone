name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          AI_PROVIDER: mock
          ANTHROPIC_API_KEY: mock
          OPENAI_API_KEY: mock