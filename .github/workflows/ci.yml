name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
      AI_PROVIDER: mock
      ANTHROPIC_API_KEY: mock
      OPENAI_API_KEY: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
